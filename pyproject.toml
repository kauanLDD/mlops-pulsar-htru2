[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# o nome da distribuição mudou; o pacote importável continua mlops_demo (Dockerfile, dvc.yaml e
# workflows dependem dele)
name = "mlops-pulsar-htru2"
dynamic = ["version"]
description = "Triagem de candidatos a pulsar (HTRU2) com CI/CD/CT: testes, retreino e API"
# sem "readme": o Dockerfile instala o pacote só com pyproject.toml e src/ (e ignora *.md)
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "pydantic>=2.5",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
# ferramentas de desenvolvimento: lint, testes e cliente HTTP do TestClient
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
# ferramentas do treinamento contínuo: pipeline versionado com DVC
ct = [
    "dvc>=3.50",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "mlops_demo.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "codigo: testes de código (pré-processamento, métricas da classe pulsar e portão)",
    "dados: testes de dados (esquema HTRU2, faixas físicas válidas, vazamento)",
    "modelo: testes de modelo (contrato recall/precisão do pulsar, baseline, comportamento)",
    "api: testes de contrato da API (/health e /predict com 8 atributos)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
