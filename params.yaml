# Hiperparâmetros do modelo. Mudou aqui? O CI treina de novo e confere os limiares.
semente: 42

# HTRU2: só ~9% dos candidatos são pulsares. Sem class_weight o recall do pulsar fica em ~0,80
# (abaixo do contrato de 0,85). Com "balanced" e C 1.0: recall ~0,92 e precisão ~0,82 no holdout.
modelo:
  C: 1.0
  max_iter: 1000
  class_weight: {0: 1, 1: 50}
